# delegate-swarm — built-in defaults.
# Do not edit this file. Override any key in:
#   ~/.config/delegate-swarm/config.toml   (your machine, all repos)
#   <repo>/.swarm/config.toml              (one repo; commit it)
# Later files win. Tables merge key by key; lists are replaced whole.
#
# Placeholders available in command templates:
#   {model} {worktree} {prompt} {prompt_file} {branch} {base} {title}
#   {body_file} {repo} {batch} {task} {pr}

[run]
max_parallel = 5            # bullets in flight at once
timeout_sec = 900           # per attempt
max_attempts = 3            # per task, rotating through the tier's models
base = "current"            # branch tasks start from; "current" = the repo's checked-out branch
branch_prefix = "swarm"     # branches are <prefix>/<batch>/<task-id>
worktree_root = "~/.cache/delegate-swarm/wt/{repo}"   # kept OUTSIDE the repo so test runners don't scan it

[granularity]
enforce = true              # refuse to fire a batch that breaks these limits (false = warn only)
max_files = 3               # files a task may modify
max_goal_chars = 1200       # a longer goal means the task should be split
max_context_chars = 2500    # the need-to-know briefing; more than this is usually a pasted file
max_context_code_lines = 25 # one code block longer than this = a file dump, paste signatures instead
max_capsule_chars = 1500    # per capsule selection
max_total_capsule_chars = 3000

[scope]
always_allowed = []         # files any task may touch, e.g. ["package-lock.json"]
forbidden = [".env", ".env.*", "*.pem", "*.key", "**/secrets/**"]   # never delegated, never touchable

[backend]
name = "opencode"
# The worker command. Swap this to change agents (see SKILL.md, "Swapping platforms").
cmd = ["opencode", "run", "--auto", "-m", "{model}", "--dir", "{worktree}", "{prompt}"]
list_models = ["opencode", "models", "opencode"]   # used by `swarm doctor`; [] to skip
env = {}

[models]
default_tier = "fast"
# Tiers are tried in order; a retry moves to the next model. Free models rotate often:
# run `swarm doctor` and update this list when one disappears.
fast = [
  "opencode/deepseek-v4.1-flash-free",
  "opencode/mimo-v2.6-flash-free",
  "opencode/glm-5.3-flash-free",
]
strong = [
  "opencode/nemotron-3-ultra-free",
  "opencode/big-pickle",
  "opencode/deepseek-v4.1-flash-free",
]

[verify]
setup = ""                  # run once in each fresh worktree before the worker, e.g. "npm ci --silent"
accept = ""                 # default acceptance command when a task has none, e.g. "npm test"
accept_timeout_sec = 600

[forge]
name = "github"
push = ["git", "push", "-u", "origin", "{branch}"]
pr_create = ["gh", "pr", "create", "--base", "{base}", "--head", "{branch}", "--title", "{title}", "--body-file", "{body_file}"]
pr_checks = ["gh", "pr", "checks", "{branch}"]
auth_check = ["gh", "auth", "status"]

[capsules]
default = []                # capsules every task in this repo gets, e.g. ["memory-vault#structure,master-files"]
paths = ["{repo_root}/.swarm/capsules", "~/.config/delegate-swarm/capsules", "{skill}/capsules"]

[prompt]
template = "{skill}/templates/worker-prompt.md"
